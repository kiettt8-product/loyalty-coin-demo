<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Loyalty Coin Campaign Demo</title>
  <link rel="icon" type="image/svg+xml" href="assets/loyalty-coin.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="Mở menu">☰</button>
    <a class="zalopay-logo" href="#" aria-label="Zalopay"><img src="assets/figma-logo.svg" alt="Zalopay"></a>
    <div class="account"><span>Kiệt. Tô Thế (8)</span><i>K</i></div>
  </header>

  <aside class="sidebar" id="sidebar">
    <nav>
      <button class="nav-parent" data-nav-target="userManagementMenu" aria-expanded="false"><img class="nav-icon" src="assets/nav-dashboard.svg" alt="">User Management<span>⌄</span></button>
      <div class="nav-sub single" id="userManagementMenu" hidden><button>Label List</button></div>
      <button class="nav-parent" data-nav-target="userProfileMenu" aria-expanded="false"><img class="nav-icon" src="assets/nav-user.svg" alt="">User Profile<span>⌄</span></button>
      <div class="nav-sub single" id="userProfileMenu" hidden><button>Segment</button></div>
      <button class="nav-parent" aria-expanded="false"><img class="nav-icon" src="assets/nav-asset.svg" alt="">Asset Management<span>⌄</span></button>
      <button class="nav-parent" aria-expanded="true"><img class="nav-icon" src="assets/nav-campaign.svg" alt="">Campaign Management<span>⌃</span></button>
      <div class="nav-sub campaign-menu">
        <button>Notification Campaign</button>
        <button>ZMS Campaign</button>
        <button data-route="asset-list">Promo Asset Campaign</button>
        <button>Promo Store Campaign</button>
        <button data-route="trigger">Trigger Based Campaign</button>
        <button>Promotion Code</button>
        <button>Revoke Voucher</button>
      </div>
      <button class="nav-parent" aria-expanded="false"><img class="nav-icon" src="assets/nav-inventory.svg" alt="">Inventory Management<span>⌄</span></button>
      <button class="nav-parent" aria-expanded="false"><img class="nav-icon" src="assets/nav-budget.svg" alt="">Budget Management<span>⌄</span></button>
      <button class="nav-parent nav-parent-no-icon" aria-expanded="false">Others<span>⌄</span></button>
    </nav>
  </aside>

  <main id="mainContent" tabindex="-1"></main>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <template id="listTemplate">
    <div class="screen list-screen">
      <section class="filter-panel">
        <div class="filter-grid" id="filterGrid">
          <input id="filterId" aria-label="Campaign ID hoặc Package ID" placeholder="Campaign ID / Package ID">
          <input id="filterMkt" aria-label="MKT Name hoặc MKT Code" placeholder="MKT Name / MKT Code">
          <select id="filterLabel" aria-label="Label"><option value="">Label</option><option>ZPO</option><option>BAU</option><option>Growth</option></select>
          <select id="filterOwner" aria-label="Created By"><option value="">Created By</option><option>kiettt8</option><option>nghiatn</option><option>linhnt22</option></select>
          <select id="filterStatus" aria-label="Status"><option value="">Status</option><option>Draft</option><option>Auto Approved</option><option>Approved</option><option>FA Review</option><option>Rejected</option><option>In Use</option><option>Ended</option></select>
          <div class="range-field"><input type="text" placeholder="From" aria-label="From date"><span>→</span><input type="text" placeholder="To" aria-label="To date"></div>
          <div class="filter-actions">
            <button class="btn secondary" id="resetFilter">Reset</button>
            <button class="btn primary" id="searchFilter">Search</button>
            <button class="text-action" id="collapseFilter">Collapse <span>⌃</span></button>
          </div>
        </div>
      </section>

      <section class="list-panel">
        <div class="list-toolbar"><button class="btn primary" id="addNew">+ Add new</button></div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>ID</th><th>MKT Code</th><th>MKT Name</th><th>Total Budget</th><th>Package ID</th><th>Distribute time</th><th>Status</th><th>Label</th><th>Created by</th><th>Action</th></tr></thead>
            <tbody id="campaignRows"></tbody>
          </table>
          <div class="empty-state" id="emptyState" hidden><strong>No data found</strong><span>Không có campaign phù hợp với filter.</span></div>
        </div>
        <div class="pagination"><span id="itemCount">1-10 of 733 items</span><button>‹</button><button class="active">1</button><button>2</button><button>3</button><span>...</span><button>74</button><button>›</button><span>10 / page</span></div>
      </section>
    </div>
  </template>

  <template id="assetListTemplate">
    <div class="screen asset-screen asset-list-screen">
      <section class="asset-filter-panel">
        <div class="asset-filter-grid" id="assetFilterGrid">
          <input id="assetFilterId" aria-label="Campaign ID, Reward ID hoặc Package ID" placeholder="Campaign ID/Reward/Package ID">
          <input id="assetFilterMkt" aria-label="MKT Name hoặc MKT Code" placeholder="MKT Name/MKT Code">
          <select id="assetFilterType" aria-label="Distribution Type"><option value="">Distribution Type</option><option>Massive</option><option>Trigger Base</option><option>Direct Discount</option><option>Loyalty Coin</option></select>
          <div class="asset-date-range" aria-label="Distribute time"><input id="assetFilterFrom" placeholder="From" aria-label="From"><span>→</span><input id="assetFilterTo" placeholder="To" aria-label="To"><span class="calendar-mark" aria-hidden="true"></span></div>
          <select id="assetFilterStatus" aria-label="Status"><option value="">Status</option><option>Draft</option><option>Approved</option><option>Auto Approved</option></select>
          <select id="assetFilterLabel" aria-label="Label"><option value="">Label</option><option>ZPO</option><option>BAU</option><option>Growth</option></select>
          <select id="assetFilterOwner" aria-label="Created by"><option value="">Created by</option><option>trongdd2</option><option>kiettt8</option><option>nghiatn</option><option>linhnt22</option></select>
          <div class="asset-filter-actions">
            <button class="asset-btn secondary" id="assetResetFilter">Reset</button>
            <button class="asset-btn primary" id="assetSearchFilter">Search</button>
            <button class="asset-collapse" id="assetCollapseFilter">Collapse <span aria-hidden="true">⌃</span></button>
          </div>
        </div>
      </section>

      <section class="asset-list-panel">
        <div class="asset-list-toolbar"><button class="asset-btn primary" id="assetAddNew"><span class="plus-mark" aria-hidden="true"></span>Add new</button></div>
        <div class="asset-table-wrap">
          <table class="asset-table">
            <thead><tr><th>ID <span class="sort-mark" aria-hidden="true"><img src="assets/icon-sort-up.svg" alt=""><img src="assets/icon-sort-down.svg" alt=""></span></th><th>MKT Name</th><th>MKT Code</th><th>Total Budget</th><th>Reward / Package ID</th><th>Distribution Type</th><th>Distribute time <span class="sort-mark" aria-hidden="true"><img src="assets/icon-sort-up.svg" alt=""><img src="assets/icon-sort-down.svg" alt=""></span></th><th>Distribute to</th><th>Status</th><th>Label</th><th>Created by</th><th>Action</th></tr></thead>
            <tbody id="assetCampaignRows"></tbody>
          </table>
        </div>
        <div class="asset-pagination">
          <span id="assetItemCount">1-10 of 940 items</span>
          <button aria-label="Previous page">‹</button><button class="active">1</button><button>2</button><button>3</button><span>•••</span><button>94</button><button aria-label="Next page">›</button>
          <select aria-label="Items per page"><option>10 / page</option></select>
        </div>
      </section>

      <dialog class="asset-choice-dialog" id="assetChoiceDialog" aria-labelledby="assetChoiceTitle">
        <form method="dialog">
          <div class="asset-dialog-heading"><h1 id="assetChoiceTitle">How you want to distribute the voucher</h1><button value="cancel" aria-label="Close dialog" class="asset-dialog-close">×</button></div>
          <label class="asset-choice"><input type="radio" name="distributionChoice" value="massive" checked><span><strong>Distribute Massive</strong><small>Schedule to distribute reward to a specific user segment!</small></span></label>
          <label class="asset-choice"><input type="radio" name="distributionChoice" value="trigger"><span><strong>Distribute based on action trigger</strong><small>After user perform an action, distribute reward to user!</small></span></label>
          <label class="asset-choice"><input type="radio" name="distributionChoice" value="coin-trigger"><span><strong>Distribute coin based on action trigger</strong><small>After user performs an action, distribute coin to user!</small></span></label>
          <label class="asset-choice"><input type="radio" name="distributionChoice" value="direct-discount"><span><strong>Direct Discount</strong><small>Users only see and apply discount at checkout page.</small></span></label>
          <div class="asset-dialog-actions"><button value="cancel" class="asset-btn secondary">Cancel</button><button value="confirm" class="asset-btn primary" id="confirmAssetType">OK</button></div>
        </form>
      </dialog>
    </div>
  </template>

  <template id="assetMassiveTemplate">
    <form class="screen asset-screen asset-massive-screen" id="assetMassiveForm" novalidate>
      <section class="asset-form-section">
        <h1>Basic Information</h1>
        <div class="asset-section-body asset-basic-grid">
          <label class="asset-field required"><span>Distribution Type</span><select id="assetDistributionType"><option value="massive">Distribute Massive</option><option value="coin-trigger">Distribute coin based on action trigger</option></select></label>
          <label class="asset-field required"><span>Distribute to</span><select id="assetDistributeTo"><option value="">Distribute to</option><option>Segment</option><option>Upload user list</option></select></label>
          <label class="asset-field required"><span>Size</span><input id="assetSize" type="number" min="1" placeholder="Size"></label>
          <label class="asset-field required"><span>Distribute time</span><div class="asset-control-icon"><input id="assetDistributeTime" type="text" placeholder="Distribute time"><span class="calendar-mark" aria-hidden="true"></span></div></label>
          <label class="asset-field required"><span>MKT Code</span><select id="assetMktCode"><option value="">MKT Code</option><option value="ZPI_060426_341">ZPI_060426_341</option><option value="TRONG_260526_TEST">TRONG_260526_TEST</option></select></label>
          <label class="asset-field"><span>MKT Name</span><select id="assetMktName" disabled><option>MKT Name</option></select></label>
          <label class="asset-field"><span>Budget control</span><select id="assetBudgetControl" disabled><option>Control budget by campaign</option></select></label>
          <label class="asset-field"><span>Campaign budget</span><div class="asset-suffix"><input id="assetCampaignBudget" placeholder="Campaign budget" disabled><b>VND</b></div></label>
          <label class="asset-field asset-group-name"><span>Group name <span class="help-mark" title="Optional group name">?</span></span><div class="asset-counted-input"><input id="assetGroupName" maxlength="100" placeholder="Group name"><small id="assetGroupCount">0 / 100</small></div></label>
        </div>
      </section>

      <section class="asset-form-section">
        <h1>Reward Package</h1>
        <div class="asset-section-body asset-package-summary">
          <label class="asset-field"><span>Package Budget</span><div class="asset-suffix"><input class="asset-package-budget" placeholder="Package Budget" disabled><b>VND</b></div></label>
          <label class="asset-field required"><span>Budget sponsor <span class="help-mark" title="Budget sponsor">?</span></span><select class="asset-budget-sponsor"><option value="">Budget sponsor</option><option>Zalopay</option><option>Merchant</option></select></label>
        </div>
        <div class="asset-reward-list" id="assetRewardList"></div>
        <button type="button" class="asset-btn secondary asset-add-reward" id="assetAddReward"><span class="plus-mark" aria-hidden="true"></span>Add More Reward</button>
      </section>

      <button type="button" class="asset-btn secondary asset-add-package" id="assetAddPackage"><span class="plus-mark" aria-hidden="true"></span>Add More Package</button>

      <section class="asset-form-section asset-alert-section">
        <h1>Budget Alert</h1>
        <div class="asset-section-body asset-alert-grid">
          <label class="asset-field"><span>Alert to</span><select><option>domain@vng.com.vn</option></select></label>
          <label class="asset-field"><span>Alert when budget low %</span><div class="asset-tag-select"><span>10 <button type="button" aria-label="Remove threshold">×</button></span><i aria-hidden="true"></i></div></label>
        </div>
      </section>

      <div class="asset-form-actions"><button type="button" class="asset-btn secondary" id="cancelAssetMassive">Cancel</button><button type="button" class="asset-btn primary" id="saveAssetMassive">Save</button><button type="submit" class="asset-btn primary">Save &amp; Submit</button></div>
    </form>
  </template>

  <template id="formTemplate">
    <form class="screen form-screen" id="campaignForm" novalidate>
      <section class="crm-section">
        <h1 class="section-title-row"><span id="formTitle">Basic Information</span><span id="formStatus"></span></h1>
        <div class="section-content basic-fields">
          <label class="field required" id="coinDistributionTypeField" hidden><span>Distribution Type</span><select id="coinDistributionType"><option value="coin-trigger">Distribute coin based on action trigger</option><option value="massive">Distribute Massive</option></select></label>
          <label class="field required"><span>Select MKT Code</span><select id="mktCode"><option value="">Select MKT Code</option><option value="shared">2893 - [28/05/2026][DLS_260528_563][BAU]</option><option value="campaign">ZPI_060426_341</option><option value="package">ZPI_060426_342</option></select></label>
          <label class="field required"><span>Select MKT Name</span><select id="mktName" disabled><option>Select MKT Name</option></select></label>
          <label class="field required"><span>Budget Control Method</span><select id="budgetMethod" disabled><option value="">Select Budget Control Method</option></select></label>
          <label class="field"><span>Allocated Budget</span><div class="suffix-input"><input id="allocatedBudget" placeholder="Allocated Budget" disabled><b>VND</b></div></label>
          <label class="field required time-field"><span>Distribute time</span><div class="time-range-control"><div class="asset-control-icon"><input id="startTime" type="datetime-local"><span class="calendar-mark" aria-hidden="true"></span></div><span class="time-range-separator" aria-hidden="true"></span><div class="asset-control-icon"><input id="endTime" type="datetime-local"><span class="calendar-mark" aria-hidden="true"></span></div></div></label>
          <label class="field"><span>Label</span><select id="campaignLabel"><option>ZPO</option><option>BAU</option><option>Growth</option></select></label>
        </div>
      </section>

      <div id="packages"></div>
      <button type="button" class="btn primary add-package" id="addPackage">Add new Package</button>

      <section class="crm-section budget-alert">
        <h1>Budget Alert</h1>
        <div class="section-content alert-fields">
          <label class="field"><span>Alert to</span><div class="tag-control" id="emailControl"><div class="tags"></div><input id="emailInput" placeholder="domain@vng.com.vn"></div></label>
          <label class="field"><span>Alert when budget low %</span><div class="tag-control" id="thresholdControl"><div class="tags"></div><input id="thresholdInput" placeholder="%"></div></label>
        </div>
      </section>

      <div class="form-actions" id="formActions">
        <button type="button" class="btn secondary" id="cancelForm">Cancel</button>
        <button type="button" class="btn primary" id="saveDraft">Save Draft</button>
        <button type="submit" class="btn primary">Save & Submit</button>
      </div>
    </form>
  </template>

  <template id="triggerTemplate">
    <form class="screen trigger-screen" id="triggerForm" novalidate>
      <section class="trigger-general">
        <label class="field required"><span>Tên Campaign</span><input placeholder="Tên Campaign" value="Trigger Loyalty Coin - New User"></label>
        <label class="field required"><span>Thời gian diễn ra campaign</span><div class="range-field"><input value="01/08/2026 00:00"><span>→</span><input value="31/12/2026 23:59"></div></label>
        <label class="field trigger-description"><span>Mô tả campaign:</span><input placeholder="Mô tả campaign"></label>
      </section>

      <div class="trigger-layout">
        <aside class="action-list">
          <div class="event-select"><span>Khi 1 sự kiện xảy ra</span><select><option>Sau khi thực hiện giao dịch thành công</option></select></div>
          <div class="action-card active"><p>Hành động bắt đầu sau khi sự kiện đầu tiên xảy ra: <b>Ngay lập tức</b></p><div><span>Hành động 1:</span><input placeholder="Mô tả"></div></div>
          <button type="button" class="add-action">+ Thêm một hành động</button>
        </aside>

        <section class="action-detail">
          <h1>Chi tiết - Hành động 1</h1>
          <div class="detail-body">
            <h2>Điều kiện</h2>
            <p>Hành động được thực hiện khi giao dịch thoả mãn điều kiện sau</p>
            <div class="condition-row"><input value="Đã thanh toán tại app_id"><select><option>In</option></select><select><option>Chọn danh sách App ID</option></select></div>
            <div class="condition-row"><input value="Có giao dịch với trạng thái"><select><option>In</option></select><select><option>Success</option></select></div>
            <button type="button" class="btn secondary add-condition">+ Thêm điều kiện</button>
            <div class="notice"><span>Hành động bắt đầu sau khi sự kiện đầu tiên xảy ra: <b>Ngay lập tức</b></span></div>

            <h2>Hành động</h2>
            <div class="action-config-grid">
              <label class="field required"><span>Hành động:</span><select><option>Phát xu</option></select></label>
              <label class="field required"><span>Số lần tối đa user nhận được hành động</span><div class="limit-control"><input value="1"><select><option>per calendar day</option></select></div></label>
              <label class="field required"><span>Campaign ID / MKT name</span><select id="triggerCampaign"><option value="">Chọn Loyalty Coin Campaign trong Promo Asset Campaign</option></select><small>Bạn cần tạo Loyalty Coin Campaign tại Promo Asset Campaign và được FA approve trước.</small></label>
              <label class="field required"><span>Package ID - Số xu phát</span><select id="triggerPackage" disabled><option>Chọn Package ID - Số xu phát đã cấu hình</option></select></label>
            </div>

            <h2>Áp dụng cho nhóm người dùng (Segment)</h2>
            <p>Hành động này được thực hiện cho nhóm người dùng nào</p>
            <div class="segment-row"><select><option>In</option></select><select><option>Chọn Segment</option></select></div>
            <label class="field required risk-field"><span>Thực hiện hành động chỉ với người dùng là</span><div class="segment-row"><select><option>Đánh giá rủi ro toàn hệ thống</option></select><select><option>Normal user</option></select></div></label>
            <button type="button" class="advanced">Điều kiện nâng cao</button>
          </div>
        </section>
      </div>

      <div class="trigger-actions"><button type="button" class="btn secondary" data-route="asset-list">Cancel</button><button type="button" class="btn primary">Save Draft</button><button type="submit" class="btn primary">Approve and Distribute</button></div>
    </form>
  </template>

  <script src="app.js"></script>
</body>
</html>
